name: Paper
description: >-
  Paper (paper.design) is a modern, agent-native design tool built on HTML and CSS web
  standards — a connected canvas where teams design, share, and ship with AI agents.
  Instead of drawing abstract vector representations of interfaces, Paper renders real
  HTML/CSS, so what you design is production code (exportable as React/Tailwind JSX) and
  what you code appears on the canvas. AI agents connect through a first-party, authenticated
  Model Context Protocol (MCP) server to read and write design files directly (Cursor, Claude
  Code, Copilot, Codex), and the app ships a browser-side WebMCP origin trial. Paper also
  publishes the open-source Paper Shaders component libraries. Backed by Accel, Bullpen
  Capital, IVP, Sapphire Ventures, and SoftBank Vision Fund.
